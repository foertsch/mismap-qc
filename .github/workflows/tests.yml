name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --with pytest python -m pytest tests/ -q

  test-extras:
    # The matrix above installs no optional dependencies on purpose, which proves
    # the package works bare but leaves the plotly, anndata and upsetplot code
    # paths skipped. This job installs every extra so those actually run.
    name: pytest (all extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests with all extras, measuring coverage
        # Coverage is measured here rather than in the matrix because this is the
        # only job that installs every extra, so it is the only one that reaches
        # the plotly, anndata and upsetplot code paths.
        run: uv run --python 3.12 --all-extras --with pytest --with pytest-cov python -m pytest tests/ -q --cov=mismap_qc --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          # A Codecov outage, or a pull request from a fork (which gets no
          # secrets), should not turn the build red. The tests still gate.
          fail_ci_if_error: false

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ruff
        # Pinned: an unpinned `--with ruff` silently changes what the lint job
        # enforces whenever ruff releases. Bump deliberately.
        run: uv run --with ruff==0.16.0 ruff check .

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the documentation
        # --strict fails on warnings: a broken internal link, or a docstring
        # griffe cannot parse. That is the point. This job caught a malformed
        # Returns section in missing_matrix_html the day it was added.
        run: uv run --all-extras mkdocs build --strict

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run mypy
        # --all-extras so the optional-dependency modules (io, plots) type-check
        # against the real packages. Pinned like ruff: a mypy release can change
        # what passes without a code change.
        run: uv run --all-extras --with mypy==2.3.1 mypy
