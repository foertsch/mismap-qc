name: Deploy docs

# Publishes the mkdocs site to GitHub Pages. The build itself is also checked on
# every pull request by the `docs build` job in tests.yml; this workflow only
# handles publishing what is already on main.
#
# Requires Pages to be enabled for the repository with "GitHub Actions" as the
# source. Without that, the deploy step fails.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "mismap_qc/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, but keep only one queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the site
        run: uv run --all-extras mkdocs build --strict

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
