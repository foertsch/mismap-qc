[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mismap-qc"
version = "0.4.1"
description = "Missing-data validation for proteomics and RNA-Seq QC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Arion Förtsch", email = "foertsch.arion@gmail.com" }]
keywords = ["bioinformatics", "rna-seq", "proteomics", "data-validation", "missing-data", "qc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
interactive = ["plotly"]
anndata = ["anndata"]
upset = ["upsetplot"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "plotly", "anndata", "upsetplot"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Repository = "https://github.com/foertsch/mismap-qc"
Documentation = "https://foertsch.github.io/mismap-qc/"
Issues = "https://github.com/foertsch/mismap-qc/issues"
Changelog = "https://github.com/foertsch/mismap-qc/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["mismap_qc"]

[tool.hatch.build.targets.sdist]
# Without this, hatchling sweeps in the whole working tree: 2.2 MB of demo PNGs,
# the CPTAC notebook, uv.lock, CLAUDE.md, DIARY.md and .claude/. An sdist should
# be what you need to build and test the package, nothing else. tests/ stays in
# deliberately so downstream packagers can verify a build.
include = [
    "mismap_qc/",
    "tests/",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
exclude = [
    ".venv",
    "examples",
    "*.ipynb",
]

[tool.ruff.lint]
# ruff's default rule set, which for the version CI pins (0.16.0) is about 400
# rules across 40 families. No explicit `select`: listing them would be
# unreadable, and the pin already holds the set still. Moving to a newer ruff can
# change the defaults, so do it as its own pull request with the resulting fixes.

[tool.ruff.lint.per-file-ignores]
# __init__.py groups its imports and __all__ by role (validation API, plots,
# readers, then internal re-exports) with comments between the groups.
# Alphabetical sorting would merge the groups and drop the comments.
"mismap_qc/__init__.py" = ["I001", "RUF022"]

[tool.mypy]
python_version = "3.10"
files = ["mismap_qc"]
# pandas, matplotlib, scipy and the optional deps ship incomplete or no stubs;
# without this every import of them is an error that says nothing about our code.
ignore_missing_imports = true

[tool.coverage.run]
source = ["mismap_qc"]
